<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Etiquetas">
<meta name="theme-color" content="#1B1F1D">
<title>Etiquetas Vinted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1B1F1D; --sup:#252A27; --bor:#343A36; --tx:#F4F2EC; --tx2:#8A928C;
  --acc:#0B6E6E; --r:14px; --r2:10px;
  --inpost:#FFC400; --inpost-tx:#16191C;
  --mondial:#E2001A; --mondial-tx:#FFFFFF;
  --vintedgo:#007782; --vintedgo-tx:#FFFFFF;
  --otro:#4A524C; --otro-tx:#FFFFFF;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-weight:500; font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%;
}
.mono{font-family:"Space Mono",ui-monospace,Menlo,Consolas,monospace}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit}

/* ---------- Estructura ---------- */
.wrap{max-width:660px;margin:0 auto;padding:0 14px calc(56px + env(safe-area-inset-bottom))}
.top{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(18px + env(safe-area-inset-top)) 0 14px;
}
.top h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--tx2);letter-spacing:0}

.card{background:var(--sup);border:1px solid var(--bor);border-radius:var(--r);padding:15px;margin-bottom:14px}
.card > h2{margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--tx2)}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}


/* ---------- Transportistas ---------- */
.trans{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.trans button{
  background:var(--bg);border:1px solid var(--bor);border-radius:var(--r2);
  padding:13px 12px;text-align:left;font-weight:600;font-size:14px;
  display:flex;align-items:center;gap:9px;min-height:52px;
}
.trans button .punto{width:13px;height:13px;border-radius:50%;background:var(--c);flex:0 0 auto;border:1px solid rgba(255,255,255,.18)}
.trans button[aria-pressed="true"]{background:var(--c);color:var(--t);border-color:var(--c);font-weight:800}
.trans button[aria-pressed="true"] .punto{background:var(--t);opacity:.75;border-color:transparent}

/* ---------- Botones ---------- */
.btn{
  border:1px solid var(--bor);background:var(--bg);color:var(--tx);
  border-radius:var(--r2);padding:13px 16px;font-weight:700;font-size:15px;
}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ancho{width:100%;display:block}
.btn.peli{border-color:#5c2b2b;color:#e9a3a3}
.btn.peli.armado{background:#E2001A;border-color:#E2001A;color:#fff}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn.chico{padding:9px 12px;font-size:13px}

/* ---------- Cola ---------- */
.vacio{color:var(--tx2);font-size:14px;text-align:center;padding:22px 10px;line-height:1.5}
ul.cola{list-style:none;margin:0;padding:0}
ul.cola li{
  display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--bor);
}
ul.cola li:first-child{border-top:0}
.barra-c{width:5px;align-self:stretch;min-height:36px;border-radius:3px;background:var(--c);flex:0 0 auto}
.n{font-size:12px;color:var(--tx2);width:22px;flex:0 0 auto;text-align:right}
.datos{flex:1;min-width:0}
/* Son spans: sin esto los tres datos se pegan en una sola línea. */
.datos .u,.datos .a,.datos .t{display:block}
.datos .u{font-family:"Space Mono",monospace;font-weight:700;font-size:15px;word-break:break-all;line-height:1.25}
.datos .a{font-size:12.5px;color:var(--tx2);line-height:1.35;word-break:break-word}
.datos .t{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--c);filter:brightness(1.25)}
.quitar{background:none;border:0;color:var(--tx2);font-size:20px;line-height:1;padding:8px 4px;flex:0 0 auto}
.quitar:active{color:#E2001A}

/* ---------- Medidor ---------- */
.medidor{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:0 0 11px}
.hueco-m{aspect-ratio:95/53;border-radius:5px;border:1px dashed #3f4642;background:#1e2321}
.hueco-m.lleno{border:1px solid transparent;background:var(--c)}
.medidor-tx{font-size:13.5px;color:var(--tx2)}
.medidor-tx b{color:var(--tx);font-weight:700}

/* ---------- Avisos ---------- */
.error{
  margin:11px 0 0;padding:11px 12px;border-radius:var(--r2);
  background:#3a1c1f;border:1px solid #6b2a2f;color:#f3c4c4;font-size:13.5px;line-height:1.45;
}

/* ---------- Hoja de impresión ----------
   Las filas van en minmax(0,1fr) y no en 1fr: 1fr es minmax(auto,1fr), así que
   una etiqueta con el texto largo estira su fila, la hoja pasa de 297mm y
   derrama una tira en el papel siguiente. Con 8 por hoja no se notaba; con 20
   salían 3 hojas para 21 etiquetas. No lo cambies a 1fr aunque parezca igual. */
#hoja{display:none}
.pagina{
  width:210mm;height:297mm;padding:8mm;background:#fff;
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:4mm;
  overflow:hidden;
}
.et{
  border:0.3mm dashed #9A9A9A;border-radius:1.5mm;overflow:hidden;background:#fff;color:#111;
  display:flex;flex-direction:column;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.et-band{
  background:var(--c);color:var(--t);
  display:flex;align-items:center;justify-content:space-between;gap:3mm;
  padding:1.8mm 3mm;
  font-family:Archivo,sans-serif;font-weight:800;font-size:8pt;letter-spacing:.06em;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.et-band .et-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.et-num{font-family:"Space Mono",monospace;font-weight:700;font-size:8pt;letter-spacing:0;flex:0 0 auto}
.et-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.4mm;padding:2.5mm 3.5mm;overflow:hidden}
.et-user{font-family:"Space Mono",monospace;font-weight:700;font-size:13pt;line-height:1.16;word-break:break-all;color:#111}
.et-art{font-family:Archivo,sans-serif;font-weight:500;font-size:7.5pt;line-height:1.28;color:#5A5A5A;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff;margin:0;padding:0}
  body > *{display:none !important}
  body > #hoja{display:block !important}
  .pagina{break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pagina:last-child{break-after:auto;page-break-after:auto}
  .et{break-inside:avoid;page-break-inside:avoid}
}

@media (max-width:360px){
  .trans{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="top">
    <h1>Etiquetas Vinted<small id="sub">Aún no hay etiquetas</small></h1>
  </div>

  <section class="card">
    <h2>Añadir a mano</h2>
    <label class="lab" for="mUsuario">Usuario de Vinted</label>
    <input class="campo mono" id="mUsuario" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="alejandroe910">
    <div class="hueco"></div>
    <label class="lab" for="mArticulo">Artículo o nº de pedido <span style="font-weight:500">· opcional</span></label>
    <input class="campo" id="mArticulo" type="text" placeholder="Chaqueta H&amp;M x Warner Bros">
    <div class="hueco"></div>
    <label class="lab">Transportista</label>
    <div class="trans" id="mTrans"></div>
    <div id="mOtroWrap" hidden>
      <div class="hueco"></div>
      <input class="campo" id="mOtro" type="text" placeholder="Nombre del transportista">
    </div>
    <div class="hueco"></div>
    <button class="btn pri ancho" id="btnAñadir" type="button">Añadir a la hoja</button>
    <p class="error" id="mError" hidden></p>
  </section>

  <section class="card">
    <h2>La hoja</h2>
    <div class="medidor" id="medidor"></div>
    <p class="medidor-tx" id="medidorTx"></p>
  </section>

  <section class="card">
    <h2>En la cola</h2>
    <div id="colaWrap"></div>
  </section>

  <button class="btn pri ancho" id="btnImprimir" type="button">Imprimir A4</button>
  <div class="hueco"></div>
  <button class="btn peli ancho" id="btnVaciar" type="button">Vaciar</button>
</div>

<div id="hoja"></div>

<script>
(function(){
'use strict';

/* ============ Constantes ============ */
var K_ET='vinted.etiquetas';
var POR_HOJA=10;

var TRANS={
  inpost:  {nombre:'InPost',        rotulo:'INPOST',        color:'#FFC400', texto:'#16191C'},
  mondial: {nombre:'Mondial Relay', rotulo:'MONDIAL RELAY', color:'#E2001A', texto:'#FFFFFF'},
  vintedgo:{nombre:'Vinted Go',     rotulo:'VINTED GO',     color:'#007782', texto:'#FFFFFF'},
  otro:    {nombre:'Otro',          rotulo:'OTRO',          color:'#4A524C', texto:'#FFFFFF'}
};
var CLAVES=['inpost','mondial','vintedgo','otro'];

/* ============ Estado ============ */
var etiquetas=[];

function carga(){
  try{
    var crudo=localStorage.getItem(K_ET);
    var lista=crudo ? JSON.parse(crudo) : [];
    if(!Array.isArray(lista)) lista=[];
    etiquetas=lista.filter(function(e){ return e && typeof e==='object' && e.usuario; })
      .map(function(e){
        return {
          id: e.id || id(),
          usuario: String(e.usuario),
          articulo: e.articulo ? String(e.articulo) : '',
          transportista: TRANS[e.transportista] ? e.transportista : 'otro',
          otroNombre: e.otroNombre ? String(e.otroNombre) : ''
        };
      });
  }catch(err){ etiquetas=[]; }
}
function guarda(){
  try{ localStorage.setItem(K_ET, JSON.stringify(etiquetas)); }
  catch(err){ alerta($('#mError'),'No se ha podido guardar en este navegador.'); }
}

/* ============ Selectores de transportista ============ */
function pintaTrans(caja, sel, alElegir){
  caja.innerHTML = CLAVES.map(function(c){
    var t=TRANS[c];
    return '<button type="button" data-t="'+c+'" aria-pressed="'+(c===sel)+'" '+
           'style="--c:'+t.color+';--t:'+t.texto+'"><span class="punto"></span>'+esc(t.nombre)+'</button>';
  }).join('');
  Array.prototype.forEach.call(caja.querySelectorAll('button'), function(b){
    b.addEventListener('click', function(){ alElegir(b.getAttribute('data-t')); });
  });
}

/* ============ Añadir a mano ============ */
var mSel='inpost';
function pintaManual(){
  pintaTrans($('#mTrans'), mSel, function(t){ mSel=t; pintaManual(); });
  $('#mOtroWrap').hidden = mSel!=='otro';
}
function alerta(el, texto){
  if(!texto){ el.hidden=true; el.textContent=''; return; }
  el.hidden=false; el.textContent=texto;
}
function añadeManual(){
  var u=$('#mUsuario').value.trim();
  if(!u){
    $('#mUsuario').classList.add('mal');
    alerta($('#mError'),'Falta el usuario de Vinted.');
    $('#mUsuario').focus();
    return;
  }
  $('#mUsuario').classList.remove('mal');
  alerta($('#mError'),'');
  etiquetas.push({
    id:id(), usuario:u, articulo:$('#mArticulo').value.trim(),
    transportista:mSel, otroNombre: mSel==='otro' ? $('#mOtro').value.trim() : ''
  });
  guarda(); render();
  $('#mUsuario').value=''; $('#mArticulo').value='';
  $('#mUsuario').focus();
}

/* ============ Medidor y cola ============ */
function render(){
  var n=etiquetas.length;
  var usados=n % POR_HOJA;
  var hoja=Math.floor(n/POR_HOJA)+1;
  var quedan=POR_HOJA-usados;
  var deEstaHoja=etiquetas.slice((hoja-1)*POR_HOJA);

  var celdas='';
  for(var i=0;i<POR_HOJA;i++){
    var e=deEstaHoja[i];
    celdas += e
      ? '<div class="hueco-m lleno" style="--c:'+trans(e.transportista).color+'"></div>'
      : '<div class="hueco-m"></div>';
  }
  $('#medidor').innerHTML=celdas;
  $('#medidorTx').innerHTML = quedan===1
    ? 'Queda <b>1 hueco</b> en la hoja '+hoja
    : 'Quedan <b>'+quedan+' huecos</b> en la hoja '+hoja;

  $('#sub').textContent = n===0
    ? 'Aún no hay etiquetas'
    : (n===1 ? '1 etiqueta · 1 hoja' : n+' etiquetas · '+Math.ceil(n/POR_HOJA)+(Math.ceil(n/POR_HOJA)===1?' hoja':' hojas'));

  var wrap=$('#colaWrap');
  if(n===0){
    wrap.innerHTML='<p class="vacio">Aún no hay etiquetas · Añade la primera venta y se quedará guardada aquí</p>';
  }else{
    wrap.innerHTML='<ul class="cola">'+etiquetas.map(function(e,i){
      var t=trans(e.transportista);
      return '<li>'+
        '<span class="barra-c" style="--c:'+t.color+'"></span>'+
        '<span class="n mono">'+dos(i+1)+'</span>'+
        '<span class="datos">'+
          '<span class="u">'+esc(e.usuario)+'</span>'+
          (e.articulo ? '<span class="a">'+esc(e.articulo)+'</span>' : '')+
          '<span class="t" style="--c:'+t.color+'">'+esc(rotulo(e))+'</span>'+
        '</span>'+
        '<button class="quitar" type="button" data-id="'+esc(e.id)+'" aria-label="Quitar '+esc(e.usuario)+'">&times;</button>'+
      '</li>';
    }).join('')+'</ul>';
    Array.prototype.forEach.call(wrap.querySelectorAll('.quitar'), function(b){
      b.addEventListener('click', function(){
        var q=b.getAttribute('data-id');
        etiquetas=etiquetas.filter(function(e){ return e.id!==q; });
        guarda(); render();
      });
    });
  }

  $('#btnImprimir').disabled = n===0;
  $('#btnVaciar').disabled = n===0;
  pintaHoja();
}

/* ============ La hoja ============ */
function pintaHoja(){
  var paginas=[];
  for(var i=0;i<etiquetas.length;i+=POR_HOJA) paginas.push(etiquetas.slice(i,i+POR_HOJA));
  $('#hoja').innerHTML = paginas.map(function(pag, p){
    return '<div class="pagina">'+pag.map(function(e,j){
      var t=trans(e.transportista);
      return '<article class="et" style="--c:'+t.color+';--t:'+t.texto+'">'+
        '<div class="et-band"><span class="et-t">'+esc(rotulo(e))+'</span>'+
        '<span class="et-num">'+dos(p*POR_HOJA+j+1)+'</span></div>'+
        '<div class="et-body">'+
          '<div class="et-user">'+esc(e.usuario)+'</div>'+
          (e.articulo ? '<div class="et-art">'+esc(e.articulo)+'</div>' : '')+
        '</div>'+
      '</article>';
    }).join('')+'</div>';
  }).join('');
}

/* ============ Vaciar en dos toques ============ */
var armado=null;
function vaciar(){
  var b=$('#btnVaciar');
  if(!armado){
    b.classList.add('armado');
    b.textContent='¿Seguro? Toca otra vez';
    armado=setTimeout(desarma, 4000);
    return;
  }
  desarma();
  etiquetas=[]; guarda(); render();
}
function desarma(){
  clearTimeout(armado); armado=null;
  var b=$('#btnVaciar');
  b.classList.remove('armado'); b.textContent='Vaciar';
}

/* ============ Arranque ============ */
carga();
pintaManual();
render();

$('#btnAñadir').addEventListener('click', añadeManual);
$('#mUsuario').addEventListener('keydown', function(e){ if(e.key==='Enter') añadeManual(); });
$('#mArticulo').addEventListener('keydown', function(e){ if(e.key==='Enter') añadeManual(); });
$('#btnImprimir').addEventListener('click', function(){ window.print(); });
$('#btnVaciar').addEventListener('click', vaciar);
})();
</script>
</body>
</html>
