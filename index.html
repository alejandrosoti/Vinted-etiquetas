<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Etiquetas">
<meta name="theme-color" content="#1B1F1D">
<title>Etiquetas Vinted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1B1F1D; --sup:#252A27; --bor:#343A36; --tx:#F4F2EC; --tx2:#8A928C;
  --acc:#0B6E6E; --r:14px; --r2:10px;
  --inpost:#FFC400; --inpost-tx:#16191C;
  --mondial:#E2001A; --mondial-tx:#FFFFFF;
  --vintedgo:#007782; --vintedgo-tx:#FFFFFF;
  --correos:#003DA5; --correos-tx:#FFFFFF;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-weight:500; font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%;
}
.mono{font-family:"Space Mono",ui-monospace,Menlo,Consolas,monospace}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit}

/* ---------- Estructura ---------- */
.wrap{max-width:660px;margin:0 auto;padding:0 14px calc(56px + env(safe-area-inset-bottom))}
.top{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(18px + env(safe-area-inset-top)) 0 14px;
}
.top h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--tx2);letter-spacing:0}

.card{background:var(--sup);border:1px solid var(--bor);border-radius:var(--r);padding:15px;margin-bottom:14px}
.card > h2{margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--tx2)}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}


/* ---------- Transportistas ---------- */
.trans{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.trans button{
  background:var(--bg);border:1px solid var(--bor);border-radius:var(--r2);
  padding:13px 12px;text-align:left;font-weight:600;font-size:14px;
  display:flex;align-items:center;gap:9px;min-height:52px;
}
.trans button .punto{width:13px;height:13px;border-radius:50%;background:var(--c);flex:0 0 auto;border:1px solid rgba(255,255,255,.18)}
.trans button[aria-pressed="true"]{background:var(--c);color:var(--t);border-color:var(--c);font-weight:800}
.trans button[aria-pressed="true"] .punto{background:var(--t);opacity:.75;border-color:transparent}
.trans.mal button{border-color:#6b2a2f}

/* ---------- Botones ---------- */
.btn{
  border:1px solid var(--bor);background:var(--bg);color:var(--tx);
  border-radius:var(--r2);padding:13px 16px;font-weight:700;font-size:15px;
}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ancho{width:100%;display:block}
.btn.peli{border-color:#5c2b2b;color:#e9a3a3}
.btn.peli.armado{background:#E2001A;border-color:#E2001A;color:#fff}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn.chico{padding:9px 12px;font-size:13px}

/* ---------- Filtro de la cola ---------- */
.filtro{
  display:flex;gap:7px;overflow-x:auto;margin:0 0 12px;padding-bottom:3px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.filtro::-webkit-scrollbar{display:none}
.filtro[hidden]{display:none}
.filtro button{
  background:var(--bg);border:1px solid var(--bor);border-radius:999px;
  padding:8px 13px;font-size:13px;font-weight:700;color:var(--tx2);
  white-space:nowrap;flex:0 0 auto;display:flex;align-items:center;gap:7px;
}
.filtro button .punto{width:9px;height:9px;border-radius:50%;background:var(--c);flex:0 0 auto}
.filtro button .cuenta{font-weight:800;opacity:.65}
.filtro button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--t);font-weight:800}
.filtro button[aria-pressed="true"] .punto{background:var(--t);opacity:.75}

/* ---------- Cola ---------- */
.vacio{color:var(--tx2);font-size:14px;text-align:center;padding:22px 10px;line-height:1.5}
ul.cola{list-style:none;margin:0;padding:0}
ul.cola li{
  display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--bor);
}
ul.cola li:first-child{border-top:0}
.barra-c{width:5px;align-self:stretch;min-height:36px;border-radius:3px;background:var(--c);flex:0 0 auto}
.n{font-size:12px;color:var(--tx2);width:22px;flex:0 0 auto;text-align:right}
.datos{flex:1;min-width:0}
/* Son spans: sin esto los tres datos se pegan en una sola línea. */
.datos .u,.datos .a,.datos .t{display:block}
.datos .u{font-family:"Space Mono",monospace;font-weight:700;font-size:15px;word-break:break-all;line-height:1.25}
.datos .a{font-size:12.5px;color:var(--tx2);line-height:1.35;word-break:break-word}
.datos .t{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--c);filter:brightness(1.25)}
.quitar{background:none;border:0;color:var(--tx2);font-size:20px;line-height:1;padding:8px 4px;flex:0 0 auto}
.quitar:active{color:#E2001A}

/* ---------- Histórico ---------- */
ul.hist{list-style:none;margin:0;padding:0}
ul.hist li{border-top:1px solid var(--bor)}
ul.hist li:first-child{border-top:0}
.hist .cab{
  display:flex;align-items:center;gap:10px;width:100%;
  background:none;border:0;padding:13px 0;text-align:left;
}
.hist .flecha{color:var(--tx2);font-size:11px;flex:0 0 auto;transition:transform .15s}
.hist li.abierta .flecha{transform:rotate(90deg)}
.hist .nom{flex:1;min-width:0;font-weight:700;font-size:14.5px}
.hist .cuenta{font-size:12px;color:var(--tx2);flex:0 0 auto}
.hist .cuerpo{padding:0 0 14px}
.hist .cuerpo[hidden]{display:none}

/* ---------- Enviado ----------
   En el histórico cada etiqueta va en dos líneas: la de siempre y, debajo,
   la del envío. Sangrada hasta donde empieza el usuario, para que se lea como
   algo de esa etiqueta y no como algo suelto entre dos filas. */
.hist .cola li{display:block;padding:12px 0}
.hist .cola .fila-et{display:flex;align-items:center;gap:11px}
.envio{display:flex;align-items:center;gap:9px;margin:9px 0 0 38px}
.marca{
  flex:1;min-width:0;display:flex;align-items:center;gap:9px;text-align:left;
  background:var(--bg);border:1px solid var(--bor);border-radius:var(--r2);
  padding:10px 12px;font-size:12.5px;font-weight:700;color:var(--tx2);
}
.marca .tic{
  width:19px;height:19px;border-radius:50%;border:1px solid #4a544e;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;
}
.marca[aria-pressed="true"]{background:#1e2a26;border-color:#2f4a41;color:#bcd8cd}
.marca[aria-pressed="true"] .tic{background:#3f9c78;border-color:#3f9c78;color:#101614}
.hist .env{
  flex:0 0 auto;font-size:11px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:#3f9c78;
}

/* ---------- Medidor ---------- */
.medidor{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:0 0 11px}
.hueco-m{aspect-ratio:95/53;border-radius:5px;border:1px dashed #3f4642;background:#1e2321}
.hueco-m.lleno{border:1px solid transparent;background:var(--c)}
.medidor-tx{font-size:13.5px;color:var(--tx2)}
.medidor-tx b{color:var(--tx);font-weight:700}

/* ---------- Capturas ---------- */
.captura{
  display:flex;align-items:center;justify-content:center;gap:9px;
  border:1px dashed #46504a;border-radius:var(--r2);padding:15px 14px;
  background:var(--bg);font-weight:700;font-size:14px;width:100%;text-align:center;color:var(--tx2);
}
.previa{display:flex;align-items:center;gap:11px;margin-top:10px}
.previa img{width:52px;height:72px;object-fit:cover;object-position:top;border-radius:7px;border:1px solid var(--bor);background:#000;flex:0 0 auto}
.previa .crece{flex:1;min-width:0;font-size:13px;color:var(--tx2)}
.mini-et{
  width:38px;height:52px;flex:0 0 auto;padding:0;border:1px solid var(--bor);
  border-radius:6px;overflow:hidden;background:#000;display:block;
}
.mini-et img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.mini-et.pon{
  border:1px dashed #46504a;background:var(--bg);color:var(--tx2);
  font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.mini-et.pon:active{border-color:var(--acc);color:var(--tx)}
.mini-et.ocupado{opacity:.4;pointer-events:none}
.visor .barra .fila{gap:8px;flex-wrap:nowrap}

/* El visor tapa la pantalla entera: una captura de móvil no se lee en miniatura */
.visor{
  position:fixed;inset:0;z-index:60;background:rgba(9,11,10,.96);
  display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
}
.visor[hidden]{display:none}
.visor .barra{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}
.visor .quien{font-family:"Space Mono",monospace;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visor .lienzo{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.visor img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.visor .cargando{color:var(--tx2);font-size:14px}

/* ---------- Estado del guardado ---------- */
.estado{
  display:flex;align-items:center;gap:8px;
  font-size:12.5px;color:var(--tx2);margin:14px 0 0;justify-content:center;
}
.estado .luz{width:8px;height:8px;border-radius:50%;background:#4a544e;flex:0 0 auto}
.estado.va .luz{background:#3f9c78}
.estado.yendo .luz{background:#c9a227}
.estado.mal{color:#e9a3a3}
.estado.mal .luz{background:#E2001A}
.estado .btn{margin-left:4px}

/* ---------- Avisos ---------- */
.parte{
  margin:12px 0 0;padding:12px 13px;border-radius:var(--r2);
  background:#1e2a26;border:1px solid #2f4a41;font-size:13.5px;line-height:1.45;color:#bcd8cd;
}
.parte b{color:var(--tx)}
.parte .fila{margin-top:11px}
.error{
  margin:11px 0 0;padding:11px 12px;border-radius:var(--r2);
  background:#3a1c1f;border:1px solid #6b2a2f;color:#f3c4c4;font-size:13.5px;line-height:1.45;
}

/* ---------- Hoja de impresión ----------
   Las filas van en minmax(0,1fr) y no en 1fr: 1fr es minmax(auto,1fr), así que
   una etiqueta con el texto largo estira su fila, la hoja pasa de 297mm y
   derrama una tira en el papel siguiente. Con 8 por hoja no se notaba; con 20
   salían 3 hojas para 21 etiquetas. No lo cambies a 1fr aunque parezca igual. */
#hoja{display:none}
.pagina{
  width:210mm;height:297mm;padding:8mm;background:#fff;
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:4mm;
  overflow:hidden;
}
.et{
  border:0.3mm dashed #9A9A9A;border-radius:1.5mm;overflow:hidden;background:#fff;color:#111;
  display:flex;flex-direction:column;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.et-band{
  background:var(--c);color:var(--t);
  display:flex;align-items:center;justify-content:space-between;gap:3mm;
  padding:1.8mm 3mm;
  font-family:Archivo,sans-serif;font-weight:800;font-size:8pt;letter-spacing:.06em;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.et-band .et-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.et-num{font-family:"Space Mono",monospace;font-weight:700;font-size:8pt;letter-spacing:0;flex:0 0 auto}
.et-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.4mm;padding:2.5mm 3.5mm;overflow:hidden}
.et-user{font-family:"Space Mono",monospace;font-weight:700;font-size:13pt;line-height:1.16;word-break:break-all;color:#111}
.et-art{font-family:Archivo,sans-serif;font-weight:500;font-size:7.5pt;line-height:1.28;color:#5A5A5A;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff;margin:0;padding:0}
  body > *{display:none !important}
  body > #hoja{display:block !important}
  .pagina{break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pagina:last-child{break-after:auto;page-break-after:auto}
  .et{break-inside:avoid;page-break-inside:avoid}
}

@media (max-width:360px){
  .trans{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="top">
    <h1>Etiquetas Vinted<small id="sub">Aún no hay etiquetas</small></h1>
  </div>

  <section class="card" id="tarjetaCodigo" hidden>
    <h2>Código de acceso</h2>
    <p class="aviso" style="margin:0 0 12px">Tus etiquetas se guardan en el servidor, no en este navegador.
      Escribe el código y las tendrás igual desde el móvil, desde el ordenador o en una ventana de incógnito.</p>
    <label class="lab" for="mCodigo">Código</label>
    <input class="campo mono" id="mCodigo" type="password" autocapitalize="none" autocorrect="off" spellcheck="false">
    <div class="hueco"></div>
    <button class="btn pri ancho" id="btnEntrar" type="button">Entrar</button>
    <p class="error" id="cError" hidden></p>
  </section>

  <div id="contenido" hidden>

  <section class="card">
    <h2>Añadir a mano</h2>
    <label class="lab" for="mUsuario">Usuario de Vinted</label>
    <input class="campo mono" id="mUsuario" type="text" autocapitalize="none" autocorrect="off" spellcheck="false">
    <div class="hueco"></div>
    <label class="lab" for="mArticulo">Artículo o nº de pedido <span style="font-weight:500">· opcional</span></label>
    <input class="campo" id="mArticulo" type="text">
    <div class="hueco"></div>
    <label class="lab">Transportista</label>
    <div class="trans" id="mTrans"></div>
    <div class="hueco"></div>
    <label class="lab">Captura <span style="font-weight:500">· opcional</span></label>
    <button class="captura" id="btnCaptura" type="button">Elegir una captura</button>
    <input id="ficheroFoto" type="file" accept="image/*" hidden>
    <div class="previa" id="previa" hidden>
      <img id="previaImg" alt="">
      <span class="crece" id="previaTx"></span>
      <button class="btn chico" id="previaQuitar" type="button">Quitar</button>
    </div>
    <div class="hueco"></div>
    <button class="btn pri ancho" id="btnAñadir" type="button" disabled>Añadir a la hoja</button>
    <p class="error" id="mError" hidden></p>
  </section>

  <section class="card">
    <h2>La hoja</h2>
    <div class="medidor" id="medidor"></div>
    <p class="medidor-tx" id="medidorTx"></p>
  </section>

  <section class="card">
    <h2>En la cola</h2>
    <div class="filtro" id="filtro" hidden></div>
    <div id="colaWrap"></div>
  </section>

  <section class="card">
    <h2>Ventas guardadas</h2>
    <div id="histWrap"></div>
  </section>

  <section class="card" id="tarjetaEnviadas" hidden>
    <h2>Ventas enviadas</h2>
    <div id="enviadasWrap"></div>
  </section>

  <button class="btn pri ancho" id="btnImprimir" type="button">Imprimir A4</button>
  <div id="parte" hidden></div>
  <div class="hueco"></div>
  <button class="btn ancho" id="btnGuardar" type="button">Guardar selección</button>
  <div class="hueco"></div>
  <button class="btn peli ancho" id="btnVaciar" type="button">Vaciar</button>

  <p class="estado" id="estado"><span class="luz"></span><span id="estadoTx"></span>
    <button class="btn chico" id="btnSalir" type="button">Olvidar código</button></p>

  </div>
</div>

<div class="visor" id="visor" hidden>
  <div class="barra">
    <span class="quien" id="visorQuien"></span>
    <span class="fila">
      <button class="btn chico" id="visorCambiar" type="button" hidden>Cambiar</button>
      <button class="btn chico peli" id="visorQuitar" type="button" hidden>Quitar</button>
      <button class="btn chico" id="visorCerrar" type="button">Cerrar</button>
    </span>
  </div>
  <div class="lienzo" id="visorLienzo"></div>
</div>

<div id="hoja"></div>

<script>
(function(){
'use strict';

/* ============ Constantes ============ */
var K_ET='vinted.etiquetas', K_HI='vinted.historico', K_COD='vinted.codigo';
var RUTA='/api/datos', RUTA_FOTO='/api/foto/';
var LADO=1100, CALIDAD=0.82;
// La miniatura viaja dentro del JSON: unos 3 KB por etiqueta. Así la fila se
// ve al instante sin una petición por cada una, y la grande solo baja al tocarla.
var LADO_MINI=150, CALIDAD_MINI=0.55, TOPE_MINI=24000;
var POR_HOJA=10;

var TRANS={
  inpost:  {nombre:'InPost',        rotulo:'INPOST',        color:'#FFC400', texto:'#16191C'},
  mondial: {nombre:'Mondial Relay', rotulo:'MONDIAL RELAY', color:'#E2001A', texto:'#FFFFFF'},
  vintedgo:{nombre:'Vinted Go',     rotulo:'VINTED GO',     color:'#007782', texto:'#FFFFFF'},
  correos: {nombre:'Correos',       rotulo:'CORREOS',       color:'#003DA5', texto:'#FFFFFF'},
  /* «Otro» ya no se puede elegir, pero no se puede borrar: las etiquetas
     guardadas antes del cambio lo llevan dentro, y tienen que seguir
     pintándose, filtrándose y enseñando el nombre que se les escribió.
     Es además el transportista al que cae cualquier valor desconocido. */
  otro:    {nombre:'Otro',          rotulo:'OTRO',          color:'#4A524C', texto:'#FFFFFF'}
};
var CLAVES=['inpost','mondial','vintedgo','correos'];

/* ============ Utilidades ============ */
function $(s,r){ return (r||document).querySelector(s); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function dos(n){ return n<10 ? '0'+n : String(n); }
function id(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function trans(t){ return TRANS[t] || TRANS.otro; }
function rotulo(e){
  if(e.transportista==='otro'){
    var n=(e.otroNombre||'').trim();
    return n ? n.toUpperCase() : 'OTRO';
  }
  return trans(e.transportista).rotulo;
}

/* ============ Estado ============ */
var etiquetas=[], historico=[], codigo='';

function normalizaEtiquetas(lista){
  if(!Array.isArray(lista)) return [];
  return lista.filter(function(e){ return e && typeof e==='object' && e.usuario; })
    .map(function(e){
      return {
        id: e.id || id(),
        usuario: String(e.usuario),
        articulo: e.articulo ? String(e.articulo) : '',
        transportista: TRANS[e.transportista] ? e.transportista : 'otro',
        otroNombre: e.otroNombre ? String(e.otroNombre) : '',
        foto: clave(e.foto),
        mini: miniatura(e.mini),
        // Lo del envío: la fecha en que se llevó y la foto del resguardo. Solo
        // se usan en el histórico, pero se validan aquí como todo lo demás.
        enviado: Number(e.enviado) || 0,
        envioFoto: clave(e.envioFoto),
        envioMini: miniatura(e.envioMini)
      };
    });
}
function clave(c){ return /^[a-z0-9]{4,40}$/.test(c) ? c : ''; }
function miniatura(m){
  return (typeof m==='string' && m.slice(0,23)==='data:image/jpeg;base64,'
          && m.length<=TOPE_MINI) ? m : '';
}
function normalizaHistorico(lista){
  if(!Array.isArray(lista)) return [];
  return lista.filter(function(v){ return v && typeof v==='object' && Array.isArray(v.etiquetas); })
    .map(function(v){
      var venta={
        id: v.id || id(),
        nombre: String(v.nombre || 'Venta sin nombre'),
        cuando: Number(v.cuando) || 0,
        etiquetas: normalizaEtiquetas(v.etiquetas)
      };
      /* Puente desde la versión en que «enviado» y la foto eran de la venta
         entera. Se reparten entre sus etiquetas para no perder lo que se hubiera
         marcado con aquello; cuando no quede nada así, esto se puede quitar. */
      if(Number(v.enviado) && !venta.etiquetas.some(function(e){ return e.enviado; }))
        venta.etiquetas.forEach(function(e){ e.enviado=Number(v.enviado); });
      if(venta.etiquetas[0] && clave(v.foto) && !venta.etiquetas[0].envioFoto){
        venta.etiquetas[0].envioFoto=clave(v.foto);
        venta.etiquetas[0].envioMini=miniatura(v.mini);
      }
      return venta;
    });
}

// El servidor manda, pero se guarda una copia local para tener algo que enseñar
// mientras baja, y para no quedarse en blanco si no hay cobertura.
function carga(){
  try{ etiquetas=normalizaEtiquetas(JSON.parse(localStorage.getItem(K_ET)||'[]')); }
  catch(err){ etiquetas=[]; }
  try{ historico=normalizaHistorico(JSON.parse(localStorage.getItem(K_HI)||'[]')); }
  catch(err){ historico=[]; }
  try{ codigo=localStorage.getItem(K_COD) || ''; }catch(err){ codigo=''; }
}
function guardaCache(){
  try{
    localStorage.setItem(K_ET, JSON.stringify(etiquetas));
    localStorage.setItem(K_HI, JSON.stringify(historico));
  }catch(err){}
}
function guarda(){ guardaCache(); sube(); }
function guardaHist(){ guarda(); }

/* ============ Selectores de transportista ============ */
function pintaTrans(caja, sel, alElegir){
  caja.innerHTML = CLAVES.map(function(c){
    var t=TRANS[c];
    return '<button type="button" data-t="'+c+'" aria-pressed="'+(c===sel)+'" '+
           'style="--c:'+t.color+';--t:'+t.texto+'"><span class="punto"></span>'+esc(t.nombre)+'</button>';
  }).join('');
  Array.prototype.forEach.call(caja.querySelectorAll('button'), function(b){
    b.addEventListener('click', function(){ alElegir(b.getAttribute('data-t')); });
  });
}

/* ============ Añadir a mano ============ */
/* Vacío a propósito: con uno puesto de fábrica, el día que se te olvide mirar
   sale una etiqueta de InPost sin que nadie lo haya decidido, y eso no se ve
   hasta que el paquete está en el punto equivocado. Mejor que no deje pasar.
   Una vez elegido se queda elegido: lo normal es meter varias del mismo sitio. */
var mSel='';
function pintaManual(){
  pintaTrans($('#mTrans'), mSel, function(t){
    mSel=t;
    $('#mTrans').classList.remove('mal');
    alerta($('#mError'),'');
    pintaManual();
  });
  refrescaAñadir();
}

/* El botón está apagado hasta que hay usuario y transportista, que es lo único
   imprescindible: el artículo es opcional y la captura se engancha después.
   Sigue habiendo comprobación dentro de añadeManual porque con Enter se llega
   igual, y ahí sí hace falta decir en voz alta qué falta. */
function refrescaAñadir(){
  $('#btnAñadir').disabled = !($('#mUsuario').value.trim() && mSel);
}
function alerta(el, texto){
  if(!texto){ el.hidden=true; el.textContent=''; return; }
  el.hidden=false; el.textContent=texto;
}
function añadeManual(){
  var u=$('#mUsuario').value.trim();
  if(!u){
    $('#mUsuario').classList.add('mal');
    alerta($('#mError'),'Falta el usuario de Vinted.');
    $('#mUsuario').focus();
    return;
  }
  $('#mUsuario').classList.remove('mal');
  if(!mSel){
    $('#mTrans').classList.add('mal');
    alerta($('#mError'),'Falta elegir el transportista.');
    return;
  }
  alerta($('#mError'),'');
  etiquetas.push({
    id:id(), usuario:u, articulo:$('#mArticulo').value.trim(),
    transportista:mSel, otroNombre:'',
    foto: fotoPendiente ? fotoPendiente.clave : '',
    mini: fotoPendiente ? fotoPendiente.mini : ''
  });
  fotoPendiente=null; pintaPrevia(); $('#ficheroFoto').value='';
  guarda(); render();
  $('#mUsuario').value=''; $('#mArticulo').value='';
  refrescaAñadir();
  $('#mUsuario').focus();
}

/* ============ Filtro por transportista ============ */
var filtro='todos';
function claveDe(e){ return TRANS[e.transportista] ? e.transportista : 'otro'; }

/* Las pestañas salen de lo que hay en la cola, no de la lista entera: ofrecer
   «Mondial Relay» cuando no hay ninguna es una pestaña que no lleva a nada.
   Con un solo transportista no hay nada que filtrar y la barra se quita.
   El filtro es solo una forma de mirar: no toca el medidor, ni el orden, ni lo
   que se imprime, que siguen siendo la cola entera. */
function pintaFiltro(){
  var caja=$('#filtro');
  var cuenta={};
  etiquetas.forEach(function(e){ var k=claveDe(e); cuenta[k]=(cuenta[k]||0)+1; });
  var presentes=CLAVES.concat('otro').filter(function(k){ return cuenta[k]; });

  // Si desaparece el transportista que se estaba mirando, se vuelve a todos:
  // si no, la lista se quedaría vacía sin que se entienda por qué.
  if(filtro!=='todos' && !cuenta[filtro]) filtro='todos';
  if(presentes.length<2){ filtro='todos'; caja.hidden=true; caja.innerHTML=''; return; }

  caja.hidden=false;
  caja.innerHTML=
    '<button type="button" data-f="todos" aria-pressed="'+(filtro==='todos')+'" style="--c:var(--acc);--t:#fff">'+
      'Todos <span class="cuenta">'+etiquetas.length+'</span></button>'+
    presentes.map(function(k){
      var t=TRANS[k];
      return '<button type="button" data-f="'+k+'" aria-pressed="'+(filtro===k)+'" '+
             'style="--c:'+t.color+';--t:'+t.texto+'">'+
             '<span class="punto"></span>'+esc(t.nombre)+
             ' <span class="cuenta">'+cuenta[k]+'</span></button>';
    }).join('');

  Array.prototype.forEach.call(caja.querySelectorAll('button'), function(b){
    b.addEventListener('click', function(){ filtro=b.getAttribute('data-f'); render(); });
  });
}

/* ============ Medidor y cola ============ */
function render(){
  var n=etiquetas.length;
  var usados=n % POR_HOJA;
  var hoja=Math.floor(n/POR_HOJA)+1;
  var quedan=POR_HOJA-usados;
  var deEstaHoja=etiquetas.slice((hoja-1)*POR_HOJA);

  var celdas='';
  for(var i=0;i<POR_HOJA;i++){
    var e=deEstaHoja[i];
    celdas += e
      ? '<div class="hueco-m lleno" style="--c:'+trans(e.transportista).color+'"></div>'
      : '<div class="hueco-m"></div>';
  }
  $('#medidor').innerHTML=celdas;
  $('#medidorTx').innerHTML = quedan===1
    ? 'Queda <b>1 hueco</b> en la hoja '+hoja
    : 'Quedan <b>'+quedan+' huecos</b> en la hoja '+hoja;

  $('#sub').textContent = n===0
    ? 'Aún no hay etiquetas'
    : (n===1 ? '1 etiqueta · 1 hoja' : n+' etiquetas · '+Math.ceil(n/POR_HOJA)+(Math.ceil(n/POR_HOJA)===1?' hoja':' hojas'));

  pintaFiltro();

  var wrap=$('#colaWrap');
  if(n===0){
    wrap.innerHTML='<p class="vacio">Aún no hay etiquetas · Añade la primera venta y se quedará guardada aquí</p>';
  }else{
    // El número que se ve es el sitio que ocupa en la hoja, no el de la lista
    // filtrada: si al ver solo InPost la 7 pasara a ser la 1, el número dejaría
    // de servir para encontrarla en el papel, que es para lo único que está.
    var visibles=etiquetas.map(function(e,i){ return {e:e, num:i+1}; })
      .filter(function(x){ return filtro==='todos' || claveDe(x.e)===filtro; });
    wrap.innerHTML='<ul class="cola">'+visibles.map(function(x){
      var e=x.e, t=trans(e.transportista);
      return '<li>'+
        '<span class="barra-c" style="--c:'+t.color+'"></span>'+
        '<span class="n mono">'+dos(x.num)+'</span>'+
        '<span class="datos">'+
          '<span class="u">'+esc(e.usuario)+'</span>'+
          (e.articulo ? '<span class="a">'+esc(e.articulo)+'</span>' : '')+
          '<span class="t" style="--c:'+t.color+'">'+esc(rotulo(e))+'</span>'+
        '</span>'+
        (e.mini
          ? '<button class="mini-et" type="button" data-ver="'+esc(e.id)+'" aria-label="Ver la captura de '+esc(e.usuario)+'"><img src="'+esc(e.mini)+'" alt=""></button>'
          : '<button class="mini-et pon" type="button" data-pon="'+esc(e.id)+'" aria-label="Añadir una captura a '+esc(e.usuario)+'">+</button>')+
        '<button class="quitar" type="button" data-id="'+esc(e.id)+'" aria-label="Quitar '+esc(e.usuario)+'">&times;</button>'+
      '</li>';
    }).join('')+'</ul>';
    Array.prototype.forEach.call(wrap.querySelectorAll('.quitar'), function(b){
      b.addEventListener('click', function(){
        var q=b.getAttribute('data-id');
        etiquetas=etiquetas.filter(function(e){ return e.id!==q; });
        guarda(); render();
      });
    });
    Array.prototype.forEach.call(wrap.querySelectorAll('.mini-et'), function(b){
      b.addEventListener('click', function(){
        var pon=b.getAttribute('data-pon');
        if(pon){ engancha(refCola(pon)); return; }
        var ver=b.getAttribute('data-ver');
        var e=etiquetas.filter(function(x){ return x.id===ver; })[0];
        if(e) abreFoto(e, refCola(ver));
      });
    });
  }

  $('#btnImprimir').disabled = n===0;
  $('#btnGuardar').disabled = n===0;
  $('#btnVaciar').disabled = n===0;
  pintaHoja();
}

/* ============ La hoja ============ */
function pintaHoja(){
  var paginas=[];
  for(var i=0;i<etiquetas.length;i+=POR_HOJA) paginas.push(etiquetas.slice(i,i+POR_HOJA));
  $('#hoja').innerHTML = paginas.map(function(pag, p){
    return '<div class="pagina">'+pag.map(function(e,j){
      var t=trans(e.transportista);
      return '<article class="et" style="--c:'+t.color+';--t:'+t.texto+'">'+
        '<div class="et-band"><span class="et-t">'+esc(rotulo(e))+'</span>'+
        '<span class="et-num">'+dos(p*POR_HOJA+j+1)+'</span></div>'+
        '<div class="et-body">'+
          '<div class="et-user">'+esc(e.usuario)+'</div>'+
          (e.articulo ? '<div class="et-art">'+esc(e.articulo)+'</div>' : '')+
        '</div>'+
      '</article>';
    }).join('')+'</div>';
  }).join('');
}

/* ============ Capturas ============ */
var fotoPendiente=null;   // {clave, dataUrl, mini, bytes} elegida y aún sin etiqueta
var destino=null;         // a qué etiqueta ya existente va la que se está eligiendo

/* Una referencia sabe leer su etiqueta y guardar donde toque, sin que el resto
   del código tenga que saber si vive en la cola o dentro de una venta ya guardada. */
function refCola(idEt){
  return {
    lee: function(){ return etiquetas.filter(function(x){ return x.id===idEt; })[0]; },
    graba: function(){ guarda(); render(); }
  };
}
function refVenta(iv, ie){
  return {
    lee: function(){ return historico[iv] && historico[iv].etiquetas[ie]; },
    graba: function(){ guardaHist(); pintaHistorico(); }
  };
}
/* La foto del envío es un segundo hueco en la misma etiqueta: la captura sigue
   siendo la de la conversación. Por eso la referencia dice en qué par de campos
   vive, y el mecanismo de capturas le vale igual. */
function refEnvio(iv, ie){
  return {
    lee: function(){ return historico[iv] && historico[iv].etiquetas[ie]; },
    campo:'envioFoto', campoMini:'envioMini',
    graba: function(){
      var e=historico[iv] && historico[iv].etiquetas[ie];
      // Guardar el resguardo es darla por enviada: nadie guarda el papel de algo
      // que no ha llevado. Quitarlo no la desmarca, que ya se fue.
      if(e && e.envioFoto && !e.enviado) e.enviado=Date.now();
      guardaHist(); pintaHistorico();
    }
  };
}

function engancha(ref){
  destino=ref;
  $('#ficheroFoto').click();
}

// Se encoge en el navegador antes de subirla: una captura de móvil son 3 MB y
// para leer un usuario y un artículo sobra con la décima parte.
function encoge(fichero){
  return new Promise(function(ok, mal){
    var url=URL.createObjectURL(fichero);
    var img=new Image();
    img.onload=function(){
      try{
        var f=Math.min(1, LADO/Math.max(img.naturalWidth, img.naturalHeight));
        var cv=document.createElement('canvas');
        cv.width=Math.max(1, Math.round(img.naturalWidth*f));
        cv.height=Math.max(1, Math.round(img.naturalHeight*f));
        var cx=cv.getContext('2d');
        cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height);
        cx.drawImage(img,0,0,cv.width,cv.height);
        var dataUrl=cv.toDataURL('image/jpeg', CALIDAD);

        var g=Math.min(1, LADO_MINI/Math.max(img.naturalWidth, img.naturalHeight));
        var cm=document.createElement('canvas');
        cm.width=Math.max(1, Math.round(img.naturalWidth*g));
        cm.height=Math.max(1, Math.round(img.naturalHeight*g));
        var cmx=cm.getContext('2d');
        cmx.fillStyle='#fff'; cmx.fillRect(0,0,cm.width,cm.height);
        cmx.drawImage(img,0,0,cm.width,cm.height);
        var mini=cm.toDataURL('image/jpeg', CALIDAD_MINI);

        URL.revokeObjectURL(url);
        cv.toBlob(function(b){
          if(b) ok({dataUrl:dataUrl, mini:mini, blob:b});
          else mal(new Error('No se ha podido preparar la imagen.'));
        }, 'image/jpeg', CALIDAD);
      }catch(err){ URL.revokeObjectURL(url); mal(err); }
    };
    img.onerror=function(){ URL.revokeObjectURL(url); mal(new Error('No se ha podido abrir la imagen.')); };
    img.src=url;
  });
}

function eligeFoto(fichero){
  var ref=destino; destino=null;   // se consume aquí: el siguiente clic empieza limpio
  if(!/^image\//.test(fichero.type)){ alerta($('#mError'),'Eso no es una imagen.'); return; }
  alerta($('#mError'),'');

  if(ref) pintaOcupado(true);
  else { $('#btnCaptura').disabled=true; $('#btnCaptura').textContent='Preparando…'; }

  return encoge(fichero).then(function(r){
    var clave=id();
    return subeFoto(clave, r.blob).then(function(){
      if(!ref){
        fotoPendiente={clave:clave, dataUrl:r.dataUrl, mini:r.mini, bytes:r.blob.size};
        pintaPrevia();
        return;
      }
      var e=ref.lee();
      if(!e){ borraFoto(clave); return; }        // la quitaron mientras subía
      var cf=ref.campo||'foto', cm=ref.campoMini||'mini';
      if(e[cf] && e[cf]!==clave) borraFoto(e[cf]);
      e[cf]=clave; e[cm]=r.mini;
      ref.graba();
    });
  }).catch(function(err){
    alerta($('#mError'), 'La captura no ha subido: '+err.message);
  }).then(function(){
    $('#btnCaptura').disabled=false;
    $('#btnCaptura').textContent='Elegir una captura';
    pintaOcupado(false);
  });
}
function pintaOcupado(si){
  Array.prototype.forEach.call(document.querySelectorAll('.mini-et'), function(b){
    b.classList.toggle('ocupado', !!si);
  });
}

function desengancha(ref){
  var e=ref && ref.lee();
  if(!e) return;
  var cf=ref.campo||'foto', cm=ref.campoMini||'mini';
  if(e[cf]) borraFoto(e[cf]);
  e[cf]=''; e[cm]='';
  ref.graba();
}

function pintaPrevia(){
  var caja=$('#previa');
  if(!fotoPendiente){ caja.hidden=true; $('#previaImg').removeAttribute('src'); return; }
  caja.hidden=false;
  $('#previaImg').src=fotoPendiente.dataUrl;
  $('#previaTx').textContent='Lista, '+Math.round(fotoPendiente.bytes/1024)+' KB. Se guarda con esta etiqueta.';
}

function olvidaFoto(){
  if(fotoPendiente) borraFoto(fotoPendiente.clave);
  fotoPendiente=null;
  pintaPrevia();
  $('#ficheroFoto').value='';
}

function subeFoto(clave, blob){
  return fetch(RUTA_FOTO+clave, {
    method:'PUT', headers:{'x-codigo':codigo, 'content-type':'image/jpeg'}, body:blob
  }).then(function(r){
    if(r.status===401){ var e=new Error('Código incorrecto.'); e.codigoMal=true; throw e; }
    if(!r.ok) throw new Error('Error '+r.status);
    return r.json();
  });
}
// Sin await ni aviso: si falla, el barrido del servidor la recoge en la siguiente subida.
function borraFoto(clave){
  fetch(RUTA_FOTO+clave, {method:'DELETE', headers:{'x-codigo':codigo}}).catch(function(){});
}

/* ---------- El visor ---------- */
var refEnVisor=null;
function abreFoto(e, ref){
  var v=$('#visor');
  refEnVisor=ref||null;
  $('#visorCambiar').hidden=!refEnVisor;
  $('#visorQuitar').hidden=!refEnVisor;
  v.hidden=false;
  document.body.style.overflow='hidden';
  $('#visorQuien').textContent=e.usuario;
  $('#visorLienzo').innerHTML='<span class="cargando">Trayendo la captura…</span>';
  fetch(RUTA_FOTO+e.foto, {headers:{'x-codigo':codigo}}).then(function(r){
    if(!r.ok) throw new Error(r.status===404 ? 'Esa captura ya no está.' : 'Error '+r.status);
    return r.blob();
  }).then(function(b){
    var url=URL.createObjectURL(b);
    var img=new Image();
    img.onload=function(){ URL.revokeObjectURL(url); };
    img.src=url;
    $('#visorLienzo').innerHTML='';
    $('#visorLienzo').appendChild(img);
  }).catch(function(err){
    $('#visorLienzo').innerHTML='<span class="cargando">'+esc(err.message)+'</span>';
  });
}
function cierraFoto(){
  $('#visor').hidden=true;
  document.body.style.overflow='';
  $('#visorLienzo').innerHTML='';
  refEnVisor=null;
}

/* ============ El servidor ============ */
var relojSubida=null, subiendo=false, pendiente=false;

function pintaEstado(clase, texto){
  $('#estado').className='estado'+(clase ? ' '+clase : '');
  $('#estadoTx').textContent=texto;
}

function llama(metodo, cuerpo){
  var o={method:metodo, headers:{'x-codigo':codigo}};
  if(cuerpo){ o.headers['content-type']='application/json'; o.body=JSON.stringify(cuerpo); }
  return fetch(RUTA, o).then(function(r){
    if(r.status===401){ var e=new Error('Código incorrecto.'); e.codigoMal=true; throw e; }
    if(!r.ok){
      return r.json().catch(function(){ return {}; }).then(function(d){
        throw new Error(d.error || ('Error '+r.status));
      });
    }
    return r.json();
  });
}

function baja(){
  pintaEstado('yendo','Trayendo del servidor…');
  return llama('GET').then(function(d){
    var suyas=normalizaEtiquetas(d.etiquetas);
    var suHist=normalizaHistorico(d.historico);

    // La primera vez el servidor está vacío y este navegador puede traer trabajo
    // de cuando no había servidor. Se sube en vez de borrárselo por encima.
    if(!suyas.length && !suHist.length && (etiquetas.length || historico.length)){
      pintaEstado('yendo','Subiendo lo que había guardado aquí…');
      return llama('PUT', {etiquetas:etiquetas, historico:historico}).then(function(){
        render(); pintaHistorico();
        pintaEstado('va','Guardado en el servidor');
      });
    }

    etiquetas=suyas; historico=suHist;
    guardaCache();
    render(); pintaHistorico();
    pintaEstado('va','Guardado en el servidor');
  });
}

// Se espera medio segundo antes de subir: escribir tres etiquetas seguidas es
// una subida, no tres. Y si llega un cambio mientras sube, se encola una sola
// repetición en vez de amontonar peticiones.
function sube(){
  if(!codigo) return;
  clearTimeout(relojSubida);
  pintaEstado('yendo','Guardando…');
  relojSubida=setTimeout(subeYa, 500);
}
function subeYa(){
  if(!codigo) return;
  if(subiendo){ pendiente=true; return; }
  subiendo=true;
  llama('PUT', {etiquetas:etiquetas, historico:historico}).then(function(){
    pintaEstado('va','Guardado en el servidor');
  }).catch(function(err){
    if(err.codigoMal){ olvida(); pideCodigo('El código ha dejado de valer. Escríbelo otra vez.'); }
    else pintaEstado('mal','No se ha podido guardar: '+err.message);
  }).then(function(){
    subiendo=false;
    if(pendiente){ pendiente=false; subeYa(); }
  });
}

function pideCodigo(mensaje){
  $('#contenido').hidden=true;
  $('#tarjetaCodigo').hidden=false;
  alerta($('#cError'), mensaje||'');
  $('#mCodigo').value='';
  $('#mCodigo').focus();
}
function olvida(){
  codigo='';
  try{ localStorage.removeItem(K_COD); }catch(err){}
}
function entra(){
  var c=$('#mCodigo').value.trim();
  if(!c){ alerta($('#cError'),'Escribe el código.'); return; }
  codigo=c;
  $('#btnEntrar').disabled=true;
  alerta($('#cError'),'');
  baja().then(function(){
    try{ localStorage.setItem(K_COD, codigo); }catch(err){}
    $('#tarjetaCodigo').hidden=true;
    $('#contenido').hidden=false;
  }).catch(function(err){
    codigo='';
    alerta($('#cError'), err.codigoMal ? 'Ese código no es.' : 'No se ha podido conectar: '+err.message);
  }).then(function(){ $('#btnEntrar').disabled=false; });
}
// Olvidar el código no borra nada del servidor: solo deja de recordarlo aquí.
function sal(){
  olvida();
  etiquetas=[]; historico=[];
  guardaCache(); render(); pintaHistorico();
  pideCodigo('Olvidado en este navegador. Tus ventas siguen en el servidor.');
}

/* ============ Ventas guardadas ============ */
function sello(d){
  return dos(d.getDate())+'/'+dos(d.getMonth()+1)+'/'+d.getFullYear()+
         ' '+dos(d.getHours())+':'+dos(d.getMinutes());
}
// Copia los datos, no las referencias: si luego se edita la cola, la venta
// guardada tiene que quedarse como estaba el día que se imprimió.
function archiva(){
  if(!etiquetas.length) return null;
  var v={
    id:id(), nombre:'Venta '+sello(new Date()), cuando:Date.now(),
    etiquetas: etiquetas.map(function(e){
      return {usuario:e.usuario, articulo:e.articulo, transportista:e.transportista,
              otroNombre:e.otroNombre, foto:e.foto||'', mini:e.mini||'',
              enviado:0, envioFoto:'', envioMini:''};
    })
  };
  historico.unshift(v);
  guardaHist(); pintaHistorico();
  return v;
}
function cuantas(n){ return n+(n===1 ? ' etiqueta' : ' etiquetas'); }

/* Una venta está en un sitio o en el otro según lo que lleve marcado: en cuanto
   se marca la última etiqueta se muda sola a las enviadas. Es solo una forma de
   repartir la misma lista; no se copia ni se mueve nada por dentro. */
function todasEnviadas(v){
  return v.etiquetas.length > 0 && v.etiquetas.every(function(e){ return e.enviado; });
}

// Qué ventas están desplegadas, por id. Sin esto, cada toque en una marca
// repintaría el histórico y le cerraría en la cara la que se está mirando.
var abiertas={};

function pintaHistorico(){
  var pendientes=[], enviadas=[];
  historico.forEach(function(v,i){
    (todasEnviadas(v) ? enviadas : pendientes).push({v:v, i:i});
  });

  pintaVentas($('#histWrap'), pendientes,
    'Todavía no hay ninguna venta guardada · Se guardan al imprimir, o con el botón «Guardar selección»');
  $('#tarjetaEnviadas').hidden = !enviadas.length;
  pintaVentas($('#enviadasWrap'), enviadas, '');
}

function pintaVentas(w, lista, siVacia){
  if(!lista.length){ w.innerHTML = siVacia ? '<p class="vacio">'+siVacia+'</p>' : ''; return; }

  w.innerHTML='<ul class="hist">'+lista.map(function(x){
    var v=x.v, abierta=!!abiertas[v.id];
    return '<li data-i="'+x.i+'"'+(abierta ? ' class="abierta"' : '')+'>'+
      '<button class="cab" type="button" aria-expanded="'+(abierta?'true':'false')+'">'+
        '<span class="flecha">&#9654;</span>'+
        '<span class="nom">'+esc(v.nombre)+'</span>'+
        (textoCabecera(v) ? '<span class="env">'+textoCabecera(v)+'</span>' : '')+
        '<span class="cuenta">'+cuantas(v.etiquetas.length)+'</span>'+
      '</button>'+
      '<div class="cuerpo"'+(abierta ? '' : ' hidden')+'>'+
        '<ul class="cola">'+v.etiquetas.map(function(e,j){
          var t=trans(e.transportista);
          return '<li>'+
            '<span class="fila-et">'+
              '<span class="barra-c" style="--c:'+t.color+'"></span>'+
              '<span class="n mono">'+dos(j+1)+'</span>'+
              '<span class="datos">'+
                '<span class="u">'+esc(e.usuario)+'</span>'+
                (e.articulo ? '<span class="a">'+esc(e.articulo)+'</span>' : '')+
                '<span class="t" style="--c:'+t.color+'">'+esc(rotulo(e))+'</span>'+
              '</span>'+
              (e.mini
                ? '<button class="mini-et" type="button" data-ver="'+j+'" aria-label="Ver la captura de '+esc(e.usuario)+'"><img src="'+esc(e.mini)+'" alt=""></button>'
                : '<button class="mini-et pon" type="button" data-pon="'+j+'" aria-label="Añadir una captura a '+esc(e.usuario)+'">+</button>')+
            '</span>'+
            '<span class="envio">'+
              '<button class="marca" type="button" data-marca="'+j+'" aria-pressed="'+(e.enviado?'true':'false')+'">'+
                textoMarca(e)+'</button>'+
              (e.envioMini
                ? '<button class="mini-et envio-f" type="button" data-env="'+j+'" aria-label="Ver la foto del envío de '+esc(e.usuario)+'"><img src="'+esc(e.envioMini)+'" alt=""></button>'
                : '<button class="mini-et pon envio-f" type="button" data-env="'+j+'" aria-label="Adjuntar la foto del envío de '+esc(e.usuario)+'">+</button>')+
            '</span>'+
          '</li>';
        }).join('')+'</ul>'+
        '<div class="hueco"></div>'+
        '<span class="fila">'+
          '<button class="btn chico devolver" type="button">Devolver a la cola</button>'+
          '<button class="btn chico peli borrar" type="button">Eliminar venta</button>'+
        '</span>'+
      '</div>'+
    '</li>';
  }).join('')+'</ul>';

  Array.prototype.forEach.call(w.querySelectorAll('.hist > li'), function(li){
    var iv=+li.getAttribute('data-i'), v=historico[iv];
    var cab=$('.cab',li), cuerpo=$('.cuerpo',li);
    cab.addEventListener('click', function(){
      var abre=cuerpo.hidden;
      cuerpo.hidden=!abre;
      abiertas[v.id]=abre;
      li.classList.toggle('abierta', abre);
      cab.setAttribute('aria-expanded', abre ? 'true' : 'false');
    });
    $('.devolver',li).addEventListener('click', function(){ devuelve(v); });
    armaBorrado($('.borrar',li), v);

    Array.prototype.forEach.call(li.querySelectorAll('.marca'), function(b){
      b.addEventListener('click', function(){
        var e=v.etiquetas[+b.getAttribute('data-marca')];
        if(!e) return;
        e.enviado = e.enviado ? 0 : Date.now();
        guardaHist(); pintaHistorico();
      });
    });
    Array.prototype.forEach.call(li.querySelectorAll('.envio-f'), function(b){
      b.addEventListener('click', function(){
        var ie=+b.getAttribute('data-env'), e=v.etiquetas[ie];
        if(!e) return;
        if(e.envioFoto) abreFoto({usuario:e.usuario, foto:e.envioFoto}, refEnvio(iv, ie));
        else engancha(refEnvio(iv, ie));
      });
    });

    // Las capturas de la conversación, que son el otro hueco de la misma fila.
    Array.prototype.forEach.call(li.querySelectorAll('.mini-et:not(.envio-f)'), function(b){
      b.addEventListener('click', function(){
        var pon=b.getAttribute('data-pon');
        if(pon!==null){ engancha(refVenta(iv, +pon)); return; }
        var ie=+b.getAttribute('data-ver');
        if(v.etiquetas[ie]) abreFoto(v.etiquetas[ie], refVenta(iv, ie));
      });
    });
  });
}
/* En dos toques, como el botón de vaciar. Una venta borrada no vuelve: se lleva
   por delante sus capturas, que el servidor barre en cuanto ve que ya no las
   menciona nadie. Si quieres quedarte con las etiquetas, devuélvelas antes. */
function armaBorrado(boton, v){
  var reloj=null;
  function desarma(){
    clearTimeout(reloj); reloj=null;
    boton.classList.remove('armado'); boton.textContent='Eliminar venta';
  }
  boton.addEventListener('click', function(){
    if(!reloj){
      boton.classList.add('armado');
      boton.textContent='¿Seguro? Toca otra vez';
      reloj=setTimeout(desarma, 4000);
      return;
    }
    desarma();
    historico=historico.filter(function(x){ return x!==v; });
    guardaHist(); pintaHistorico();
    parte('Venta <b>'+esc(v.nombre)+'</b> eliminada, con sus '+cuantas(v.etiquetas.length)+'.', true);
  });
}

function textoMarca(e){
  return '<span class="tic">&#10003;</span>'+
         (e.enviado ? 'Enviado · '+esc(sello(new Date(e.enviado))) : 'Marcar como enviado');
}

// Cuántas van, y solo mientras queden: cuando están todas, la venta ya está en
// «Ventas enviadas» y repetirlo en su fila no dice nada nuevo.
function textoCabecera(v){
  var n=v.etiquetas.filter(function(e){ return e.enviado; }).length;
  return (n && n<v.etiquetas.length) ? n+'/'+v.etiquetas.length : '';
}

// Vuelven con id nuevo: si la venta se devuelve dos veces, no se pisan entre sí
// ni con las que ya estuvieran en la cola.
function devuelve(v){
  v.etiquetas.forEach(function(e){
    etiquetas.push({
      id:id(), usuario:e.usuario, articulo:e.articulo||'',
      transportista:e.transportista, otroNombre:e.otroNombre||'',
      foto:e.foto||'', mini:e.mini||''
    });
  });
  guarda(); render();
  parte('Devueltas <b>'+cuantas(v.etiquetas.length)+'</b> a la cola, al final de lo que ya había.', true);
}

/* ============ El parte de después de imprimir ============ */
var relojParte=null;
function parte(html, seSolo){
  clearTimeout(relojParte);
  var c=$('#parte');
  c.hidden=false;
  c.innerHTML='<div class="parte">'+html+'</div>';
  if(seSolo) relojParte=setTimeout(cierraParte, 6000);
}
function cierraParte(){
  clearTimeout(relojParte); relojParte=null;
  var c=$('#parte'); c.hidden=true; c.innerHTML='';
}

function imprime(){
  var v=archiva();
  window.print();
  if(!v) return;
  parte('Guardada como <b>'+esc(v.nombre)+'</b> con '+cuantas(v.etiquetas.length)+'.<br>'+
        '¿Ha salido bien la impresión?'+
        '<div class="fila">'+
          '<button class="btn chico" id="siVaciar" type="button">Sí, vaciar la cola</button> '+
          '<button class="btn chico" id="noVaciar" type="button">No, dejarla</button>'+
        '</div>');
  $('#siVaciar').addEventListener('click', function(){
    etiquetas=[]; guarda(); render(); cierraParte();
  });
  $('#noVaciar').addEventListener('click', cierraParte);
}

// Guardar la selección NO crea una venta en el histórico: eso solo pasa al
// imprimir. Aquí solo se fuerza el guardado de la cola, que de todas formas ya
// se guarda sola en cada alta y cada baja; el botón está para verlo confirmado.
function guardaSeleccion(){
  if(!etiquetas.length) return;
  guarda();
  parte('Selección guardada: '+cuantas(etiquetas.length)+'. Sigue aquí cuando vuelvas a abrir la página, '+
        'y no pasa al histórico hasta que la imprimas.', true);
}

/* ============ Vaciar en dos toques ============ */
var armado=null;
function vaciar(){
  var b=$('#btnVaciar');
  if(!armado){
    b.classList.add('armado');
    b.textContent='¿Seguro? Toca otra vez';
    armado=setTimeout(desarma, 4000);
    return;
  }
  desarma();
  etiquetas=[]; guarda(); render();
}
function desarma(){
  clearTimeout(armado); armado=null;
  var b=$('#btnVaciar');
  b.classList.remove('armado'); b.textContent='Vaciar';
}

/* ============ Arranque ============ */
carga();
pintaManual();
render();
pintaHistorico();

$('#btnAñadir').addEventListener('click', añadeManual);
$('#mUsuario').addEventListener('input', refrescaAñadir);
$('#mUsuario').addEventListener('keydown', function(e){ if(e.key==='Enter') añadeManual(); });
$('#mArticulo').addEventListener('keydown', function(e){ if(e.key==='Enter') añadeManual(); });
$('#btnImprimir').addEventListener('click', imprime);
$('#btnGuardar').addEventListener('click', guardaSeleccion);
$('#btnEntrar').addEventListener('click', entra);
$('#mCodigo').addEventListener('keydown', function(e){ if(e.key==='Enter') entra(); });
$('#btnSalir').addEventListener('click', sal);
$('#btnCaptura').addEventListener('click', function(){ $('#ficheroFoto').click(); });
$('#ficheroFoto').addEventListener('change', function(){
  // Copiar antes de vaciar el input: el FileList es el mismo objeto y se vacía con él.
  var f=(this.files||[])[0];
  this.value='';
  if(f) eligeFoto(f);
});
$('#previaQuitar').addEventListener('click', olvidaFoto);
$('#visorCerrar').addEventListener('click', cierraFoto);
$('#visorCambiar').addEventListener('click', function(){ var r=refEnVisor; cierraFoto(); engancha(r); });
$('#visorQuitar').addEventListener('click', function(){ var r=refEnVisor; cierraFoto(); desengancha(r); });
$('#visor').addEventListener('click', function(e){ if(e.target===this) cierraFoto(); });

if(codigo){
  $('#contenido').hidden=false;
  baja().catch(function(err){
    if(err.codigoMal){ olvida(); pideCodigo('El código ha dejado de valer. Escríbelo otra vez.'); }
    else pintaEstado('mal','Sin conexión con el servidor: esto es la última copia de este navegador');
  });
}else{
  pideCodigo('');
}
$('#btnVaciar').addEventListener('click', vaciar);
})();
</script>
